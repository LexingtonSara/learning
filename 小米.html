<!DOCTYPE html>
<html lang="en">
<head>

	<title>小米商城</title> 
    <style>
        body {
            margin: 0;
        }
        .sub-header {
            height: 100px;
        }
        .container {
            max-width: 1128px;
            margin: 0 auto;

        .sub-header .ht{

        .sub-header .logo {

        }
        .sub-header .menu-list {

        }
        .sub-header .menu-list a:hover {

        }
            
        .sub-header .search-box {
            float: right;
        }

</head>
<body>
	<div class="sub-header"> 
        <div class="container">
            <div class="ht logo">
                <a href="http://www.mi.com/"  target="_blank" style="margin-top:22px; display: inline-block;">
                    <img src="D:\Program Files\learning\logo-mi2.png" alt="小米商城" style="height: 56px; width: 56px;"> 
                </a>
            </div>
            <div class="ht menu-list">
                <a href="http://www.mi.com/" target="_blank">Xiaomi手机</a>
                <a href="http://www.mi.com/" target="_blank">Redmi红米</a>
                <a href="http://www.mi.com/" target="_blank">电视</a>

        </div>
    </div>
